<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#2b2926">
<title>Login | GRID Intranet</title>
<link rel="preload" href="assets/ReadexPro-Variable.ttf" as="font" type="font/ttf" crossorigin>
<style>
  @font-face {
    font-family: "Readex Pro";
    src: url("assets/ReadexPro-Variable.ttf") format("truetype");
    font-weight: 160 700;
    font-display: swap;
  }

  /* Markenfarben wie auf grid-agency.de (src/app/globals.css) */
  :root {
    --sky: #2b2926;
    --snow: #e4e2e7;
    --dune: #afaaa0;
    --earth: #676159;
    --error: #f2a49a;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }

  body {
    min-height: 100dvh;
    display: grid;
    place-items: center;
    padding: 24px 16px calc(24px + env(safe-area-inset-bottom));
    /* Pattern zur Mitte hin abdunkeln, damit die Karte ruhig steht */
    background:
      radial-gradient(ellipse at center, rgb(43 41 38 / .7) 0%, rgb(43 41 38 / .35) 70%),
      var(--sky) url("assets/pattern.png") repeat;
    background-size: auto, 420px auto;
    color: var(--snow);
    font-family: "Readex Pro", system-ui, -apple-system, sans-serif;
    font-weight: 300;
    -webkit-font-smoothing: antialiased;
  }

  ::selection { background: var(--dune); color: var(--sky); }

  main { width: 100%; max-width: 380px; }

  .brand {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    margin-bottom: 28px;
  }
  .brand img { width: 128px; height: auto; }
  .brand span {
    font-size: 11px;
    letter-spacing: .3em;
    text-transform: uppercase;
    color: color-mix(in srgb, var(--snow) 45%, transparent);
  }

  /* Liquid-Glass-Karte wie .glass auf der Website */
  .card {
    position: relative;
    padding: 32px 24px 28px;
    border-radius: 28px;
    background: linear-gradient(
      to bottom,
      color-mix(in srgb, var(--snow) 12%, transparent),
      color-mix(in srgb, var(--snow) 5%, transparent)
    );
    -webkit-backdrop-filter: blur(24px) saturate(1.6);
    backdrop-filter: blur(24px) saturate(1.6);
    border: 1px solid color-mix(in srgb, var(--snow) 16%, transparent);
    box-shadow:
      inset 0 1px 0 color-mix(in srgb, var(--snow) 18%, transparent),
      0 8px 32px rgb(0 0 0 / .35);
  }
  .card[hidden] { display: none; }

  h1 {
    margin: 0 0 6px;
    font-size: 24px;
    font-weight: 500;
    letter-spacing: -.01em;
  }
  .lead {
    margin: 0 0 24px;
    font-size: 14px;
    color: color-mix(in srgb, var(--snow) 60%, transparent);
    overflow-wrap: anywhere;
  }

  /* Buttons: Primär (Snow mit Aurora-Hover wie .btn-rainbow) und Sekundär
     (Outline). Jeder Button zeigt beim Warten einen Spinner (.is-loading). */
  .btn {
    position: relative;
    width: 100%;
    height: 48px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    border-radius: 999px;
    font: inherit;
    font-size: 15px;
    font-weight: 500;
    cursor: pointer;
    transition: transform .2s ease, box-shadow .25s ease, background-color .2s;
  }
  .btn-primary { border: 0; background: var(--snow); color: var(--sky); }
  .btn-primary:hover:not(:disabled) {
    background-image: linear-gradient(92deg, #feda75, #fa7e1e, #d62976, #962fbf, #feda75);
    background-size: 200% 100%;
    animation: rainbow-slide 1.6s linear infinite;
    transform: scale(1.02);
    box-shadow: 0 10px 34px rgb(250 126 30 / .35);
  }
  .btn-secondary {
    border: 1px solid color-mix(in srgb, var(--snow) 22%, transparent);
    background: none;
    color: var(--snow);
  }
  .btn-secondary:hover:not(:disabled) { background: color-mix(in srgb, var(--snow) 8%, transparent); }
  .btn:active:not(:disabled) { transform: scale(.97); }
  .btn:disabled { cursor: progress; }
  .btn:disabled:not(.is-loading) { opacity: .6; cursor: not-allowed; }
  @keyframes rainbow-slide { to { background-position: -200% 0; } }

  .btn .ms-logo { width: 18px; height: 18px; flex: none; }
  .spinner {
    display: none;
    width: 18px;
    height: 18px;
    flex: none;
    border-radius: 50%;
    border: 2px solid currentColor;
    border-right-color: transparent;
    animation: spin .7s linear infinite;
  }
  .btn.is-loading .spinner { display: block; }
  .btn.is-loading .ms-logo { display: none; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .status {
    min-height: 20px;
    margin: 14px 0 0;
    font-size: 13px;
    text-align: center;
  }
  .status.error { color: var(--error); }

  .hint {
    margin: 4px 0 0;
    font-size: 12px;
    text-align: center;
    color: color-mix(in srgb, var(--snow) 45%, transparent);
  }
  .hint a { color: inherit; }
  .hint a:hover { color: var(--snow); }

  footer {
    margin-top: 24px;
    display: flex;
    justify-content: center;
    gap: 16px;
    font-size: 11px;
  }
  footer a { color: color-mix(in srgb, var(--snow) 35%, transparent); text-decoration: none; }
  footer a:hover { color: color-mix(in srgb, var(--snow) 60%, transparent); }

  @media (prefers-reduced-motion: reduce) {
    .btn-primary:hover:not(:disabled) { animation: none; transform: none; }
    .spinner { animation-duration: 1.6s; }
  }
</style>
</head>
<body>
<main>
  <div class="brand">
    <a href="https://grid-agency.de" aria-label="Zur GRID Website">
      <img src="assets/logo.png" alt="GRID" width="626" height="226">
    </a>
    <span>Intranet</span>
  </div>

  <!-- Abgemeldet -->
  <section class="card" id="signed-out">
    <h1>Willkommen zurück</h1>
    <p class="lead">Melde dich mit deinem GRID-Microsoft-Konto an.</p>

    <button type="button" class="btn btn-primary is-loading" id="sign-in" disabled aria-busy="true">
      <span class="spinner" aria-hidden="true"></span>
      <svg class="ms-logo" viewBox="0 0 21 21" aria-hidden="true"><path fill="#f25022" d="M0 0h10v10H0z"/><path fill="#7fba00" d="M11 0h10v10H11z"/><path fill="#00a4ef" d="M0 11h10v10H0z"/><path fill="#ffb900" d="M11 11h10v10H11z"/></svg>
      <span class="label">Anmeldung wird geprüft …</span>
    </button>
    <p class="status" role="status" aria-live="polite"></p>
    <p class="hint">
      Probleme beim Login? <a href="mailto:hello@grid-agency.de?subject=Intranet-Login">hello@grid-agency.de</a>
    </p>
  </section>

  <!-- Angemeldet -->
  <section class="card" id="signed-in" hidden>
    <h1>Hallo <span id="user-name"></span></h1>
    <p class="lead">Angemeldet als <span id="user-email"></span>. Hier entsteht das GRID Intranet.</p>

    <button type="button" class="btn btn-secondary" id="sign-out">
      <span class="spinner" aria-hidden="true"></span>
      <span class="label">Abmelden</span>
    </button>
  </section>

  <footer>
    <a href="https://grid-agency.de">grid-agency.de</a>
    <a href="https://grid-agency.de/impressum">Impressum</a>
    <a href="https://grid-agency.de/datenschutz">Datenschutz</a>
  </footer>
</main>

<!-- Offizielles Browser-Bundle von @azure/msal-browser v5.25.1 (MIT),
     lokal eingebunden, damit beim Seitenaufruf kein Drittanbieter-CDN lädt. -->
<script src="assets/msal-browser.min.js"></script>
<script>
  // Microsoft Entra ID (Azure AD): App-Registrierung "GRID Intranet",
  // Plattform "Single-page application", Redirect-URI
  // https://intranet.grid-agency.de/ (für Tests zusätzlich http://localhost:…/).
  // Die Client-ID steht auf der Übersichtsseite der App-Registrierung.
  const CLIENT_ID = "";
  // Nur Konten aus dem GRID-Tenant; statt der Domain geht auch die Tenant-ID.
  const TENANT = "grid-agency.de";

  const signedOut = document.getElementById("signed-out");
  const signedIn = document.getElementById("signed-in");
  const signInButton = document.getElementById("sign-in");
  const signOutButton = document.getElementById("sign-out");
  const status = signedOut.querySelector(".status");

  function setLoading(button, loading, label) {
    button.disabled = loading;
    button.classList.toggle("is-loading", loading);
    button.setAttribute("aria-busy", String(loading));
    button.querySelector(".label").textContent = label;
  }

  function showError(message) {
    status.textContent = message;
    status.className = "status error";
  }

  function showAccount(account) {
    document.getElementById("user-name").textContent =
      (account.name || account.username).split(" ")[0];
    document.getElementById("user-email").textContent = account.username;
    signedOut.hidden = true;
    signedIn.hidden = false;
  }

  function errorMessage(error) {
    const code = error && error.errorCode;
    if (code === "user_cancelled") return "Anmeldung abgebrochen.";
    if (code === "interaction_in_progress") return "Eine Anmeldung läuft bereits. Bitte kurz warten.";
    if (code === "access_denied" || /AADSTS50020|AADSTS90072/.test(error && error.message))
      return "Bitte melde dich mit deinem @grid-agency.de-Konto an.";
    return "Anmeldung fehlgeschlagen. Bitte versuch es erneut.";
  }

  const msalApp = CLIENT_ID
    ? new msal.PublicClientApplication({
        auth: {
          clientId: CLIENT_ID,
          authority: `https://login.microsoftonline.com/${TENANT}`,
          redirectUri: `${location.origin}/`,
          postLogoutRedirectUri: `${location.origin}/`,
        },
        cache: { cacheLocation: "localStorage" },
      })
    : null;

  // Beim Laden: Rückkehr vom Microsoft-Login verarbeiten bzw. bestehende
  // Sitzung erkennen. Bis dahin zeigt der Button den Spinner.
  (async () => {
    if (!msalApp) {
      setLoading(signInButton, false, "Mit Microsoft anmelden");
      return;
    }
    try {
      await msalApp.initialize();
      const result = await msalApp.handleRedirectPromise();
      const account = result ? result.account : msalApp.getAllAccounts()[0];
      if (account) {
        msalApp.setActiveAccount(account);
        showAccount(account);
      }
    } catch (error) {
      showError(errorMessage(error));
    }
    setLoading(signInButton, false, "Mit Microsoft anmelden");
  })();

  signInButton.addEventListener("click", async () => {
    status.textContent = "";
    status.className = "status";
    if (!msalApp) {
      showError("Der Microsoft-Login ist noch nicht eingerichtet.");
      return;
    }
    setLoading(signInButton, true, "Weiterleitung zu Microsoft …");
    try {
      // Leitet die Seite zu Microsoft weiter; der Spinner bleibt bis dahin.
      await msalApp.loginRedirect({ scopes: ["User.Read"], prompt: "select_account" });
    } catch (error) {
      showError(errorMessage(error));
      setLoading(signInButton, false, "Mit Microsoft anmelden");
    }
  });

  signOutButton.addEventListener("click", async () => {
    setLoading(signOutButton, true, "Abmelden …");
    try {
      await msalApp.logoutRedirect({ account: msalApp.getActiveAccount() });
    } catch {
      setLoading(signOutButton, false, "Abmelden");
    }
  });
</script>
</body>
</html>
