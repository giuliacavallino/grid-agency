<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#2b2926">
<title>Login | GRID Intranet</title>
<link rel="preload" href="assets/ReadexPro-Variable.ttf" as="font" type="font/ttf" crossorigin>
<style>
  @font-face {
    font-family: "Readex Pro";
    src: url("assets/ReadexPro-Variable.ttf") format("truetype");
    font-weight: 160 700;
    font-display: swap;
  }

  /* Markenfarben wie auf grid-agency.de (src/app/globals.css) */
  :root {
    --sky: #2b2926;
    --snow: #e4e2e7;
    --dune: #afaaa0;
    --earth: #676159;
    --error: #f2a49a;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }

  body {
    min-height: 100dvh;
    display: grid;
    place-items: center;
    padding: 24px 16px calc(24px + env(safe-area-inset-bottom));
    /* Pattern zur Mitte hin abdunkeln, damit die Karte ruhig steht */
    background:
      radial-gradient(ellipse at center, rgb(43 41 38 / .7) 0%, rgb(43 41 38 / .35) 70%),
      var(--sky) url("assets/pattern.png") repeat;
    background-size: auto, 420px auto;
    color: var(--snow);
    font-family: "Readex Pro", system-ui, -apple-system, sans-serif;
    font-weight: 300;
    -webkit-font-smoothing: antialiased;
  }

  ::selection { background: var(--dune); color: var(--sky); }

  main { width: 100%; max-width: 380px; }

  .brand {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    margin-bottom: 28px;
  }
  .brand img { width: 128px; height: auto; }
  .brand span {
    font-size: 11px;
    letter-spacing: .3em;
    text-transform: uppercase;
    color: color-mix(in srgb, var(--snow) 45%, transparent);
  }

  /* Liquid-Glass-Karte wie .glass auf der Website */
  .card {
    position: relative;
    padding: 32px 24px 28px;
    border-radius: 28px;
    background: linear-gradient(
      to bottom,
      color-mix(in srgb, var(--snow) 12%, transparent),
      color-mix(in srgb, var(--snow) 5%, transparent)
    );
    -webkit-backdrop-filter: blur(24px) saturate(1.6);
    backdrop-filter: blur(24px) saturate(1.6);
    border: 1px solid color-mix(in srgb, var(--snow) 16%, transparent);
    box-shadow:
      inset 0 1px 0 color-mix(in srgb, var(--snow) 18%, transparent),
      0 8px 32px rgb(0 0 0 / .35);
  }

  h1 {
    margin: 0 0 6px;
    font-size: 24px;
    font-weight: 500;
    letter-spacing: -.01em;
  }
  .lead {
    margin: 0 0 24px;
    font-size: 14px;
    color: color-mix(in srgb, var(--snow) 60%, transparent);
  }

  label {
    display: block;
    margin-bottom: 6px;
    font-size: 12px;
    font-weight: 400;
    color: color-mix(in srgb, var(--snow) 70%, transparent);
  }
  .field { margin-bottom: 16px; }
  .field-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
  }

  input[type="email"],
  input[type="password"],
  input[type="text"] {
    width: 100%;
    height: 48px;
    padding: 0 16px;
    border-radius: 14px;
    border: 1px solid color-mix(in srgb, var(--snow) 14%, transparent);
    background: color-mix(in srgb, var(--sky) 55%, transparent);
    color: var(--snow);
    font: inherit;
    font-size: 16px; /* verhindert iOS-Zoom */
    outline: none;
    transition: border-color .2s, box-shadow .2s;
  }
  input::placeholder { color: color-mix(in srgb, var(--snow) 30%, transparent); }
  input:focus {
    border-color: color-mix(in srgb, var(--snow) 45%, transparent);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--snow) 10%, transparent);
  }
  input[aria-invalid="true"] { border-color: var(--error); }

  .password { position: relative; }
  .password input { padding-right: 52px; }
  .toggle {
    position: absolute;
    top: 0; right: 0;
    width: 48px; height: 48px;
    display: grid; place-items: center;
    border: 0; background: none; cursor: pointer;
    color: color-mix(in srgb, var(--snow) 50%, transparent);
  }
  .toggle:hover { color: var(--snow); }
  .toggle svg { width: 18px; height: 18px; }
  .toggle .hide { display: none; }
  .toggle[aria-pressed="true"] .show { display: none; }
  .toggle[aria-pressed="true"] .hide { display: block; }

  .link {
    font-size: 12px;
    color: color-mix(in srgb, var(--snow) 50%, transparent);
    text-decoration: none;
  }
  .link:hover { color: var(--snow); text-decoration: underline; text-underline-offset: 3px; }

  .remember {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 4px 0 24px;
    font-size: 13px;
    color: color-mix(in srgb, var(--snow) 70%, transparent);
    cursor: pointer;
  }
  .remember input { width: 16px; height: 16px; margin: 0; accent-color: var(--snow); }

  /* Primärbutton inkl. Aurora-Hover wie .btn-rainbow */
  button[type="submit"] {
    width: 100%;
    height: 48px;
    border: 0;
    border-radius: 999px;
    background: var(--snow);
    color: var(--sky);
    font: inherit;
    font-size: 15px;
    font-weight: 500;
    cursor: pointer;
    transition: transform .2s ease, box-shadow .25s ease;
  }
  button[type="submit"]:hover:not(:disabled) {
    background-image: linear-gradient(92deg, #feda75, #fa7e1e, #d62976, #962fbf, #feda75);
    background-size: 200% 100%;
    animation: rainbow-slide 1.6s linear infinite;
    transform: scale(1.02);
    box-shadow: 0 10px 34px rgb(250 126 30 / .35);
  }
  button[type="submit"]:active:not(:disabled) { transform: scale(.97); }
  button[type="submit"]:disabled { opacity: .6; cursor: progress; }
  @keyframes rainbow-slide { to { background-position: -200% 0; } }

  .status {
    min-height: 20px;
    margin: 14px 0 0;
    font-size: 13px;
    text-align: center;
  }
  .status.error { color: var(--error); }

  footer {
    margin-top: 24px;
    display: flex;
    justify-content: center;
    gap: 16px;
    font-size: 11px;
  }
  footer a { color: color-mix(in srgb, var(--snow) 35%, transparent); text-decoration: none; }
  footer a:hover { color: color-mix(in srgb, var(--snow) 60%, transparent); }

  @media (prefers-reduced-motion: reduce) {
    button[type="submit"]:hover:not(:disabled) { animation: none; transform: none; }
  }
</style>
</head>
<body>
<main>
  <div class="brand">
    <a href="https://grid-agency.de" aria-label="Zur GRID Website">
      <img src="assets/logo.png" alt="GRID" width="626" height="226">
    </a>
    <span>Intranet</span>
  </div>

  <div class="card">
    <h1>Willkommen zurück</h1>
    <p class="lead">Melde dich mit deinem GRID-Account an.</p>

    <form id="login" novalidate>
      <div class="field">
        <label for="email">E-Mail</label>
        <input id="email" name="email" type="email" autocomplete="username"
               placeholder="vorname@grid-agency.de" required autofocus>
      </div>

      <div class="field">
        <div class="field-row">
          <label for="password">Passwort</label>
          <a class="link" href="mailto:hello@grid-agency.de?subject=Intranet%3A%20Passwort%20vergessen">Passwort vergessen?</a>
        </div>
        <div class="password">
          <input id="password" name="password" type="password"
                 autocomplete="current-password" placeholder="••••••••" required>
          <button type="button" class="toggle" aria-label="Passwort anzeigen" aria-pressed="false">
            <svg class="show" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg class="hide" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9.9 4.2A9.8 9.8 0 0 1 12 4c6.5 0 10 8 10 8a17 17 0 0 1-2.2 3.2M6.6 6.6A17 17 0 0 0 2 12s3.5 7 10 7a9.7 9.7 0 0 0 5.4-1.6"/><path d="M14.1 14.1a3 3 0 1 1-4.2-4.2"/><path d="m2 2 20 20"/></svg>
          </button>
        </div>
      </div>

      <label class="remember">
        <input type="checkbox" name="remember"> Angemeldet bleiben
      </label>

      <button type="submit">Anmelden</button>
      <p class="status" role="status" aria-live="polite"></p>
    </form>
  </div>

  <footer>
    <a href="https://grid-agency.de">grid-agency.de</a>
    <a href="https://grid-agency.de/impressum">Impressum</a>
    <a href="https://grid-agency.de/datenschutz">Datenschutz</a>
  </footer>
</main>

<script>
  const form = document.getElementById("login");
  const email = form.email;
  const password = form.password;
  const status = form.querySelector(".status");
  const submit = form.querySelector('button[type="submit"]');
  const toggle = form.querySelector(".toggle");

  toggle.addEventListener("click", () => {
    const visible = toggle.getAttribute("aria-pressed") === "true";
    toggle.setAttribute("aria-pressed", String(!visible));
    toggle.setAttribute("aria-label", visible ? "Passwort anzeigen" : "Passwort verbergen");
    password.type = visible ? "password" : "text";
  });

  function showError(message, field) {
    status.textContent = message;
    status.className = "status error";
    if (field) {
      field.setAttribute("aria-invalid", "true");
      field.focus();
    }
  }

  [email, password].forEach((input) =>
    input.addEventListener("input", () => input.removeAttribute("aria-invalid"))
  );

  // Platzhalter: Hier wird das Auth-Backend angebunden. Bis dahin
  // lehnt der Login jeden Versuch mit einem Hinweis ab.
  async function signIn(/* { email, password, remember } */) {
    throw new Error("Der Intranet-Login ist noch nicht freigeschaltet.");
  }

  form.addEventListener("submit", async (event) => {
    event.preventDefault();
    status.textContent = "";
    status.className = "status";

    if (!email.value.trim() || !email.validity.valid) {
      return showError("Bitte gib eine gültige E-Mail-Adresse ein.", email);
    }
    if (!password.value) {
      return showError("Bitte gib dein Passwort ein.", password);
    }

    submit.disabled = true;
    submit.textContent = "Anmelden …";
    try {
      await signIn({
        email: email.value.trim(),
        password: password.value,
        remember: form.remember.checked,
      });
    } catch (error) {
      showError(error.message);
    } finally {
      submit.disabled = false;
      submit.textContent = "Anmelden";
    }
  });
</script>
</body>
</html>
