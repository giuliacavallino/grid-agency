<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>GRID Intranet</title>
<style>
  :root { --bg:#f4efe6; --fg:#2b2620; }
  @media (prefers-color-scheme: dark) { :root { --bg:#1d1a16; --fg:#f4efe6; } }
  html,body { height:100%; margin:0; }
  body { display:grid; place-items:center; background:var(--bg); color:var(--fg);
         font-family: system-ui, -apple-system, sans-serif; }
  main { text-align:center; padding:16px; }
  img { width:160px; height:auto; }
  p { opacity:.7; }
</style>
</head>
<body>
<main>
  <img src="logo.png" alt="GRID Agency">
  <h1>Intranet</h1>
  <p>Hier entsteht das GRID Intranet.</p>
</main>
</body>
</html>
