<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#2b2926">
<title>GRID Intranet</title>
<link rel="preload" href="assets/ReadexPro-Variable.ttf" as="font" type="font/ttf" crossorigin>
<style>
  @font-face {
    font-family: "Readex Pro";
    src: url("assets/ReadexPro-Variable.ttf") format("truetype");
    font-weight: 160 700;
    font-display: swap;
  }

  /* Markenfarben wie auf grid-agency.de (src/app/globals.css) */
  :root {
    --sky: #2b2926;
    --snow: #e4e2e7;
    --dune: #afaaa0;
    --earth: #676159;
    --error: #f2a49a;
    --aurora: linear-gradient(92deg, #feda75, #fa7e1e, #d62976, #962fbf, #feda75);
    /* Seitenbreite wie --container-frame-lg der Website */
    --frame: 1088px;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  [hidden] { display: none !important; }

  body {
    min-height: 100dvh;
    background: var(--sky) url("assets/pattern.png") repeat;
    background-size: 420px auto;
    color: var(--snow);
    font-family: "Readex Pro", system-ui, -apple-system, sans-serif;
    font-weight: 300;
    -webkit-font-smoothing: antialiased;
  }

  ::selection { background: var(--dune); color: var(--sky); }

  /* Liquid-Glass-Fläche wie .glass auf der Website */
  .glass {
    background: linear-gradient(
      to bottom,
      color-mix(in srgb, var(--snow) 12%, transparent),
      color-mix(in srgb, var(--snow) 5%, transparent)
    );
    -webkit-backdrop-filter: blur(24px) saturate(1.6);
    backdrop-filter: blur(24px) saturate(1.6);
    border: 1px solid color-mix(in srgb, var(--snow) 16%, transparent);
    box-shadow:
      inset 0 1px 0 color-mix(in srgb, var(--snow) 18%, transparent),
      0 8px 32px rgb(0 0 0 / .35);
  }

  .icon {
    width: 20px;
    height: 20px;
    flex: none;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.8;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  /* ---------- Login ---------- */

  .login {
    min-height: 100dvh;
    display: grid;
    place-items: center;
    padding: 24px 16px calc(24px + env(safe-area-inset-bottom));
    /* Pattern zur Mitte hin abdunkeln, damit die Karte ruhig steht */
    background: radial-gradient(ellipse at center, rgb(43 41 38 / .7) 0%, rgb(43 41 38 / .35) 70%);
  }
  .login > div { width: 100%; max-width: 380px; }

  .brand {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    margin-bottom: 28px;
  }
  .brand img { width: 128px; height: auto; }
  .brand span {
    font-size: 11px;
    letter-spacing: .3em;
    text-transform: uppercase;
    color: color-mix(in srgb, var(--snow) 45%, transparent);
  }

  .card {
    position: relative;
    padding: 32px 24px 28px;
    border-radius: 28px;
  }

  h1 {
    margin: 0 0 6px;
    font-size: 24px;
    font-weight: 500;
    letter-spacing: -.01em;
  }
  .lead {
    margin: 0 0 24px;
    font-size: 14px;
    color: color-mix(in srgb, var(--snow) 60%, transparent);
    overflow-wrap: anywhere;
  }

  /* Buttons: Primär (Snow mit Aurora-Hover wie .btn-rainbow) und Sekundär
     (Outline). Jeder Button zeigt beim Warten einen Spinner (.is-loading). */
  .btn {
    position: relative;
    width: 100%;
    height: 48px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    border-radius: 999px;
    font: inherit;
    font-size: 15px;
    font-weight: 500;
    text-decoration: none;
    cursor: pointer;
    transition: transform .2s ease, box-shadow .25s ease, background-color .2s;
  }
  .btn-primary { border: 0; background: var(--snow); color: var(--sky); }
  .btn-primary:hover:not(:disabled) {
    background-image: var(--aurora);
    background-size: 200% 100%;
    animation: rainbow-slide 1.6s linear infinite;
    transform: scale(1.02);
    box-shadow: 0 10px 34px rgb(250 126 30 / .35);
  }
  .btn-secondary {
    border: 1px solid color-mix(in srgb, var(--snow) 22%, transparent);
    background: none;
    color: var(--snow);
  }
  .btn-secondary:hover:not(:disabled) { background: color-mix(in srgb, var(--snow) 8%, transparent); }
  .btn:active:not(:disabled) { transform: scale(.97); }
  .btn:disabled { cursor: progress; }
  .btn:disabled:not(.is-loading) { opacity: .6; cursor: not-allowed; }
  @keyframes rainbow-slide { to { background-position: -200% 0; } }

  .btn .ms-logo { width: 18px; height: 18px; flex: none; }
  .spinner {
    display: none;
    width: 18px;
    height: 18px;
    flex: none;
    border-radius: 50%;
    border: 2px solid currentColor;
    border-right-color: transparent;
    animation: spin .7s linear infinite;
  }
  .btn.is-loading .spinner { display: block; }
  .btn.is-loading .ms-logo,
  .btn.is-loading .icon { display: none; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .status {
    min-height: 20px;
    margin: 14px 0 0;
    font-size: 13px;
    text-align: center;
  }
  .status.error { color: var(--error); }

  .hint {
    margin: 4px 0 0;
    font-size: 12px;
    text-align: center;
    color: color-mix(in srgb, var(--snow) 45%, transparent);
  }
  .hint a { color: inherit; }
  .hint a:hover { color: var(--snow); }

  .legal {
    display: flex;
    justify-content: center;
    gap: 16px;
    font-size: 11px;
  }
  .login .legal { margin-top: 24px; }
  .legal a { color: color-mix(in srgb, var(--snow) 35%, transparent); text-decoration: none; }
  .legal a:hover { color: color-mix(in srgb, var(--snow) 60%, transparent); }

  /* ---------- Hub ---------- */

  .hub {
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    /* Oben ruhiger, damit Navbar und Begrüßung sauber lesbar sind */
    background: linear-gradient(to bottom, rgb(43 41 38 / .85), rgb(43 41 38 / .55) 60%, rgb(43 41 38 / .8));
  }

  .frame {
    width: 100%;
    max-width: var(--frame);
    margin: 0 auto;
    padding: 0 20px;
  }

  /* Navbar als schwebende Glas-Pill wie TopBar.tsx der Website */
  .topbar {
    position: fixed;
    inset: 0 0 auto;
    z-index: 40;
    padding-top: calc(env(safe-area-inset-top) + 12px);
    pointer-events: none;
  }
  .topbar .bar {
    position: relative;
    height: 52px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding: 0 8px 0 20px;
    border-radius: 999px;
    pointer-events: auto;
  }
  /* Lichtkante oben wie auf der Website */
  .topbar .bar::before {
    content: "";
    position: absolute;
    inset: 0 24px auto;
    height: 1px;
    background: linear-gradient(to right, transparent, color-mix(in srgb, var(--snow) 40%, transparent), transparent);
    pointer-events: none;
  }

  .logo {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    color: inherit;
    text-decoration: none;
  }
  .logo-mark { position: relative; display: inline-block; transition: transform .25s ease; }
  .logo-mark img { display: block; height: 26px; width: auto; }
  /* Aurora läuft beim Hover durch die Buchstaben (wie .logo-rainbow) */
  .logo-mark::after {
    content: "";
    position: absolute;
    inset: 0;
    background: var(--aurora);
    background-size: 200% 100%;
    -webkit-mask: url("assets/logo.png") center / contain no-repeat;
    mask: url("assets/logo.png") center / contain no-repeat;
    opacity: 0;
    transition: opacity .25s ease;
    animation: rainbow-slide 1.4s linear infinite;
    pointer-events: none;
  }
  .logo:hover .logo-mark { transform: scale(1.08); }
  .logo:hover .logo-mark::after { opacity: 1; }
  .logo-sub {
    margin-top: -6px;
    padding-left: 3px;
    font-size: 9px;
    font-weight: 500;
    letter-spacing: .32em;
    text-transform: uppercase;
    color: color-mix(in srgb, var(--snow) 70%, transparent);
  }

  .nav { display: none; align-items: center; gap: 26px; font-size: 15px; font-weight: 400; }
  .nav a {
    color: color-mix(in srgb, var(--snow) 80%, transparent);
    text-decoration: none;
    white-space: nowrap;
  }
  .nav a[aria-current="page"] { color: var(--snow); font-weight: 500; }
  /* Buchstaben füllen sich beim Hover mit dem Verlauf (wie .nav-rainbow) */
  .nav a:hover {
    background-image: var(--aurora);
    background-size: 200% 100%;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: rainbow-slide 1.4s linear infinite;
  }

  .bar-actions { display: flex; align-items: center; gap: 6px; }

  .icon-btn,
  .avatar {
    width: 38px;
    height: 38px;
    display: grid;
    place-items: center;
    padding: 0;
    border: 0;
    border-radius: 50%;
    background: none;
    color: var(--snow);
    font: inherit;
    cursor: pointer;
    transition: transform .15s ease, background-color .2s;
  }
  .icon-btn:hover { background: color-mix(in srgb, var(--snow) 10%, transparent); }
  .icon-btn:active, .avatar:active { transform: scale(.9); }
  .avatar {
    background: var(--snow);
    color: var(--sky);
    font-size: 13px;
    font-weight: 600;
    letter-spacing: .02em;
  }
  .avatar:hover { box-shadow: 0 0 0 3px color-mix(in srgb, var(--snow) 22%, transparent); }

  /* Aufklappbare Panels unter der Navbar: Konto und Mobile-Menü */
  .popover {
    position: absolute;
    top: calc(100% + 10px);
    right: 0;
    width: min(300px, calc(100vw - 40px));
    padding: 8px;
    border-radius: 24px;
    pointer-events: auto;
    /* Deckender als .glass, damit der Inhalt dahinter nicht durchscheint */
    background-color: rgb(43 41 38 / .97);
    animation: pop-in .18s ease-out;
  }
  @keyframes pop-in { from { opacity: 0; transform: translateY(-6px); } }
  .account-info { padding: 12px 12px 14px; }
  .account-info strong { display: block; font-size: 15px; font-weight: 500; }
  .account-info span {
    display: block;
    margin-top: 2px;
    font-size: 13px;
    color: color-mix(in srgb, var(--snow) 55%, transparent);
    overflow-wrap: anywhere;
  }
  .popover .btn { height: 44px; font-size: 14px; }

  .menu-list { display: grid; gap: 2px; margin: 0; padding: 0; list-style: none; }
  .menu-list a {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 11px 12px;
    border-radius: 16px;
    color: color-mix(in srgb, var(--snow) 85%, transparent);
    text-decoration: none;
    font-size: 15px;
    font-weight: 400;
  }
  .menu-list a:hover { background: color-mix(in srgb, var(--snow) 8%, transparent); color: var(--snow); }
  .menu-list a[aria-current="page"] { background: color-mix(in srgb, var(--snow) 12%, transparent); color: var(--snow); font-weight: 500; }
  .menu-list .ext { margin-left: auto; width: 15px; height: 15px; opacity: .5; }

  .content { flex: 1; padding-top: calc(env(safe-area-inset-top) + 100px); padding-bottom: 48px; }

  .eyebrow {
    margin: 0 0 10px;
    font-size: 11px;
    font-weight: 500;
    letter-spacing: .3em;
    text-transform: uppercase;
    color: color-mix(in srgb, var(--snow) 50%, transparent);
  }
  .greeting {
    margin: 0;
    font-size: clamp(30px, 7vw, 48px);
    font-weight: 500;
    letter-spacing: -.02em;
    line-height: 1.1;
  }
  .sub {
    margin: 10px 0 0;
    font-size: 15px;
    color: color-mix(in srgb, var(--snow) 60%, transparent);
  }

  /* Kacheln: 2 Spalten mobil, 4 ab Desktop. Sales ist die breite
     Hauptkachel, dadurch gehen 7 Bereiche in beiden Rastern glatt auf. */
  .tiles {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 12px;
    margin: 32px 0 0;
    padding: 0;
    list-style: none;
  }
  .tiles li:first-child { grid-column: span 2; }

  .tile {
    position: relative;
    height: 100%;
    min-height: 150px;
    display: flex;
    flex-direction: column;
    padding: 18px;
    border-radius: 24px;
    color: var(--snow);
    text-decoration: none;
    overflow: hidden;
    transition: transform .25s ease, border-color .25s ease, box-shadow .25s ease;
  }
  .tile:hover {
    transform: translateY(-3px);
    border-color: color-mix(in srgb, var(--snow) 30%, transparent);
    box-shadow:
      inset 0 1px 0 color-mix(in srgb, var(--snow) 24%, transparent),
      0 14px 40px rgb(0 0 0 / .45);
  }
  .tile:active { transform: scale(.98); }
  .tile:focus-visible, .nav a:focus-visible, .menu-list a:focus-visible,
  .icon-btn:focus-visible, .avatar:focus-visible, .btn:focus-visible, .logo:focus-visible {
    outline: 2px solid var(--snow);
    outline-offset: 3px;
  }

  .tile-icon {
    width: 44px;
    height: 44px;
    display: grid;
    place-items: center;
    border-radius: 14px;
    background: color-mix(in srgb, var(--snow) 10%, transparent);
    border: 1px solid color-mix(in srgb, var(--snow) 12%, transparent);
    transition: background-color .25s, color .25s;
  }
  .tile-icon .icon { width: 22px; height: 22px; }
  .tile:hover .tile-icon { background: var(--snow); color: var(--sky); }

  .tile-arrow {
    position: absolute;
    top: 18px;
    right: 18px;
    width: 18px;
    height: 18px;
    opacity: .4;
    transition: opacity .25s, transform .25s ease;
  }
  .tile:hover .tile-arrow { opacity: 1; transform: translate(2px, -2px); }

  .tile-text { margin-top: auto; padding-top: 22px; }
  .tile h2 { margin: 0; font-size: 18px; font-weight: 500; letter-spacing: -.01em; }
  .tile p {
    margin: 4px 0 0;
    font-size: 13px;
    line-height: 1.4;
    color: color-mix(in srgb, var(--snow) 55%, transparent);
  }
  /* Zwei Zeilen reservieren, damit die Titel in einer Reihe auf einer Höhe stehen */
  .tile:not(.is-featured) p { min-height: 2.8em; }
  .tile.is-featured h2 { font-size: 22px; }
  .tile.is-featured p { font-size: 14px; }

  /* Platzhalter für Bereiche, die noch gebaut werden */
  .area-head { display: flex; align-items: center; gap: 16px; }
  .area-head .tile-icon { width: 56px; height: 56px; border-radius: 18px; }
  .area-head .tile-icon .icon { width: 26px; height: 26px; }
  .area-card {
    margin-top: 32px;
    padding: 28px 24px;
    border-radius: 28px;
    max-width: 520px;
  }
  .area-card h2 { margin: 0 0 6px; font-size: 18px; font-weight: 500; }
  .area-card .btn { width: auto; padding: 0 22px; margin-top: 4px; display: inline-flex; }

  .hub .legal { padding: 0 20px calc(24px + env(safe-area-inset-bottom)); }

  @media (min-width: 800px) {
    .topbar { padding-top: 24px; }
    .topbar .bar { height: 68px; padding: 0 12px 0 28px; }
    .logo-mark img { height: 30px; }
    .logo-sub { font-size: 10px; margin-top: -7px; }
    .content { padding-top: calc(env(safe-area-inset-top) + 140px); }
    .tiles { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; margin-top: 40px; }
    .tile { min-height: 190px; padding: 22px; }
    .tile-arrow { top: 22px; right: 22px; }
  }
  @media (min-width: 1000px) {
    .nav { display: flex; }
    .menu-toggle { display: none !important; }
  }

  @media (prefers-reduced-motion: reduce) {
    .btn-primary:hover:not(:disabled),
    .nav a:hover,
    .logo-mark::after { animation: none; }
    .btn-primary:hover:not(:disabled),
    .tile:hover,
    .logo:hover .logo-mark { transform: none; }
    .popover { animation: none; }
    .spinner { animation-duration: 1.6s; }
  }
</style>
</head>

<!-- ===== Login ===== -->
<main class="login" id="login">
  <div>
    <div class="brand">
      <a href="https://grid-agency.de" aria-label="Zur GRID Website">
        <img src="assets/logo.png" alt="GRID" width="626" height="226">
      </a>
      <span>Intranet</span>
    </div>

    <section class="card glass">
      <h1>Willkommen zurück</h1>
      <p class="lead">Melde dich mit deinem GRID-Microsoft-Konto an.</p>

      <button type="button" class="btn btn-primary is-loading" id="sign-in" disabled aria-busy="true">
        <span class="spinner" aria-hidden="true"></span>
        <svg class="ms-logo" viewBox="0 0 21 21" aria-hidden="true"><path fill="#f25022" d="M0 0h10v10H0z"/><path fill="#7fba00" d="M11 0h10v10H11z"/><path fill="#00a4ef" d="M0 11h10v10H0z"/><path fill="#ffb900" d="M11 11h10v10H11z"/></svg>
        <span class="label">Anmeldung wird geprüft …</span>
      </button>
      <p class="status" role="status" aria-live="polite"></p>
      <p class="hint">
        Probleme beim Login? <a href="mailto:hello@grid-agency.de?subject=Intranet-Login">hello@grid-agency.de</a>
      </p>
    </section>

    <footer class="legal">
      <a href="https://grid-agency.de">grid-agency.de</a>
      <a href="https://grid-agency.de/impressum">Impressum</a>
      <a href="https://grid-agency.de/datenschutz">Datenschutz</a>
    </footer>
  </div>
</main>

<!-- ===== Hub (nach dem Login) ===== -->
<div class="hub" id="hub" hidden>
  <header class="topbar">
    <div class="frame">
      <div class="bar glass">
        <a href="#/" class="logo" aria-label="Zur Übersicht">
          <span class="logo-mark"><img src="assets/logo.png" alt="GRID" width="626" height="226"></span>
          <span class="logo-sub">Intranet</span>
        </a>

        <nav class="nav" id="nav" aria-label="Bereiche"></nav>

        <div class="bar-actions">
          <button type="button" class="avatar" id="account-toggle" aria-expanded="false" aria-controls="account-panel" aria-label="Konto"></button>
          <button type="button" class="icon-btn menu-toggle" id="menu-toggle" aria-expanded="false" aria-controls="menu-panel" aria-label="Menü öffnen">
            <svg class="icon"><use href="#i-menu"/></svg>
          </button>
        </div>

        <div class="popover glass" id="account-panel" hidden>
          <div class="account-info">
            <strong id="user-name"></strong>
            <span id="user-email"></span>
          </div>
          <button type="button" class="btn btn-secondary" id="sign-out">
            <span class="spinner" aria-hidden="true"></span>
            <svg class="icon" aria-hidden="true"><use href="#i-logout"/></svg>
            <span class="label">Abmelden</span>
          </button>
        </div>

        <div class="popover glass" id="menu-panel" hidden>
          <ul class="menu-list" id="menu-list"></ul>
        </div>
      </div>
    </div>
  </header>

  <main class="content frame" id="view"></main>

  <footer class="legal">
    <a href="https://grid-agency.de">grid-agency.de</a>
    <a href="https://grid-agency.de/impressum">Impressum</a>
    <a href="https://grid-agency.de/datenschutz">Datenschutz</a>
  </footer>
</div>

<!-- Offizielles Browser-Bundle von @azure/msal-browser v5.25.1 (MIT),
     lokal eingebunden, damit beim Seitenaufruf kein Drittanbieter-CDN lädt. -->
<script src="assets/msal-browser.min.js"></script>
<script>
  // Microsoft Entra ID (Azure AD): App-Registrierung "GRID Intranet",
  // Plattform "Single-page application", Redirect-URI
  // https://intranet.grid-agency.de/ (für Tests zusätzlich http://localhost:…/).
  // Die Client-ID steht auf der Übersichtsseite der App-Registrierung.
  const CLIENT_ID = "";
  // Nur Konten aus dem GRID-Tenant; statt der Domain geht auch die Tenant-ID.
  const TENANT = "grid-agency.de";

  // Bereiche des Hubs: Navbar, Mobile-Menü, Kacheln und Bereichsseiten
  // entstehen alle aus dieser Liste. Mit "href" öffnet die Kachel eine
  // externe App (Microsoft 365) in einem neuen Tab statt einer eigenen Seite.
  const AREAS = [
    { id: "sales", title: "Sales", text: "Leads, Angebote und Kund*innen im Blick" },
    { id: "personal", title: "Personal", text: "Team, Urlaub und Onboarding" },
    { id: "marketing", title: "Marketing", text: "Eigene Kanäle, Content und Kampagnen" },
    { id: "mail", title: "Mail", text: "Dein Outlook-Postfach", href: "https://outlook.office.com/mail/" },
    { id: "kalender", title: "Kalender", text: "Termine und Meetings in Outlook", href: "https://outlook.office.com/calendar/" },
    { id: "aufgaben", title: "Aufgaben", text: "To-dos und Zuständigkeiten" },
    { id: "admin", title: "Admin", text: "Zugänge, Rechte und Einstellungen" },
  ];

  const loginView = document.getElementById("login");
  const hubView = document.getElementById("hub");
  const signInButton = document.getElementById("sign-in");
  const signOutButton = document.getElementById("sign-out");
  const status = loginView.querySelector(".status");
  const view = document.getElementById("view");

  // ---------- Login ----------

  function setLoading(button, loading, label) {
    button.disabled = loading;
    button.classList.toggle("is-loading", loading);
    button.setAttribute("aria-busy", String(loading));
    button.querySelector(".label").textContent = label;
  }

  function showError(message) {
    status.textContent = message;
    status.className = "status error";
  }

  function errorMessage(error) {
    const code = error && error.errorCode;
    if (code === "user_cancelled") return "Anmeldung abgebrochen.";
    if (code === "interaction_in_progress") return "Eine Anmeldung läuft bereits. Bitte kurz warten.";
    if (code === "access_denied" || /AADSTS50020|AADSTS90072/.test(error && error.message))
      return "Bitte melde dich mit deinem @grid-agency.de-Konto an.";
    return "Anmeldung fehlgeschlagen. Bitte versuch es erneut.";
  }

  const msalApp = CLIENT_ID
    ? new msal.PublicClientApplication({
        auth: {
          clientId: CLIENT_ID,
          authority: `https://login.microsoftonline.com/${TENANT}`,
          redirectUri: `${location.origin}/`,
          postLogoutRedirectUri: `${location.origin}/`,
        },
        cache: { cacheLocation: "localStorage" },
      })
    : null;

  // Solange keine Client-ID eingetragen ist, zeigt localhost den Hub mit
  // einem Vorschau-Konto, damit er sich ohne Login entwickeln lässt.
  const PREVIEW = !msalApp && ["localhost", "127.0.0.1"].includes(location.hostname);

  // Beim Laden: Rückkehr vom Microsoft-Login verarbeiten bzw. bestehende
  // Sitzung erkennen. Bis dahin zeigt der Button den Spinner.
  async function init() {
    if (PREVIEW) {
      showHub({ name: "Vorschau", username: "vorschau@grid-agency.de" });
      return;
    }
    if (!msalApp) {
      setLoading(signInButton, false, "Mit Microsoft anmelden");
      return;
    }
    try {
      await msalApp.initialize();
      const result = await msalApp.handleRedirectPromise();
      const account = result ? result.account : msalApp.getAllAccounts()[0];
      if (account) {
        msalApp.setActiveAccount(account);
        showHub(account);
      }
    } catch (error) {
      showError(errorMessage(error));
    }
    setLoading(signInButton, false, "Mit Microsoft anmelden");
  }

  signInButton.addEventListener("click", async () => {
    status.textContent = "";
    status.className = "status";
    if (!msalApp) {
      showError("Der Microsoft-Login ist noch nicht eingerichtet.");
      return;
    }
    setLoading(signInButton, true, "Weiterleitung zu Microsoft …");
    try {
      // Leitet die Seite zu Microsoft weiter; der Spinner bleibt bis dahin.
      await msalApp.loginRedirect({ scopes: ["User.Read"], prompt: "select_account" });
    } catch (error) {
      showError(errorMessage(error));
      setLoading(signInButton, false, "Mit Microsoft anmelden");
    }
  });

  signOutButton.addEventListener("click", async () => {
    setLoading(signOutButton, true, "Abmelden …");
    if (!msalApp) {
      location.reload();
      return;
    }
    try {
      await msalApp.logoutRedirect({ account: msalApp.getActiveAccount() });
    } catch {
      setLoading(signOutButton, false, "Abmelden");
    }
  });

  // ---------- Hub ----------

  let firstName = "";

  function icon(id, extraClass = "") {
    return `<svg class="icon ${extraClass}" aria-hidden="true"><use href="#i-${id}"/></svg>`;
  }

  function escapeHtml(text) {
    return text.replace(/[&<>"']/g, (c) => `&#${c.charCodeAt(0)};`);
  }

  // Externe Bereiche öffnen in neuem Tab, interne laufen über #/bereich
  function linkAttrs(area) {
    return area.href
      ? `href="${area.href}" target="_blank" rel="noopener"`
      : `href="#/${area.id}" data-area="${area.id}"`;
  }

  function showHub(account) {
    const name = account.name || account.username;
    firstName = name.split(" ")[0];
    const initials = name.split(/\s+/).map((part) => part[0]).slice(0, 2).join("").toUpperCase();

    document.getElementById("account-toggle").textContent = initials;
    document.getElementById("user-name").textContent = name;
    document.getElementById("user-email").textContent = account.username;

    document.getElementById("nav").innerHTML = AREAS
      .map((area) => `<a ${linkAttrs(area)}>${area.title}</a>`)
      .join("");
    document.getElementById("menu-list").innerHTML = [
      { id: "uebersicht", title: "Übersicht" },
      ...AREAS,
    ]
      .map((area) => {
        const attrs = area.id === "uebersicht" ? `href="#/" data-area=""` : linkAttrs(area);
        return `<li><a ${attrs}>${icon(area.id)}${area.title}${area.href ? icon("arrow", "ext") : ""}</a></li>`;
      })
      .join("");

    loginView.hidden = true;
    hubView.hidden = false;
    render();
  }

  function greeting() {
    const hour = new Date().getHours();
    if (hour < 5) return "Gute Nacht";
    if (hour < 11) return "Guten Morgen";
    if (hour < 18) return "Hallo";
    return "Guten Abend";
  }

  function renderOverview() {
    const today = new Date().toLocaleDateString("de-DE", { weekday: "long", day: "numeric", month: "long" });
    document.title = "Übersicht | GRID Intranet";
    view.innerHTML = `
      <p class="eyebrow">${today}</p>
      <h1 class="greeting">${greeting()}, ${escapeHtml(firstName)}</h1>
      <p class="sub">Wohin geht’s heute?</p>
      <ul class="tiles">
        ${AREAS.map((area, index) => `
          <li>
            <a class="tile glass${index === 0 ? " is-featured" : ""}" ${linkAttrs(area)}>
              <span class="tile-icon">${icon(area.id)}</span>
              ${icon("arrow", "tile-arrow")}
              <span class="tile-text">
                <h2>${area.title}</h2>
                <p>${area.text}</p>
              </span>
            </a>
          </li>`).join("")}
      </ul>`;
  }

  function renderArea(area) {
    document.title = `${area.title} | GRID Intranet`;
    view.innerHTML = `
      <div class="area-head">
        <span class="tile-icon">${icon(area.id)}</span>
        <div>
          <p class="eyebrow">Bereich</p>
          <h1 class="greeting">${area.title}</h1>
        </div>
      </div>
      <section class="area-card glass">
        <h2>Hier wird gerade gebaut</h2>
        <p class="lead">${area.text}: Dieser Bereich des Intranets entsteht gerade.</p>
        <a class="btn btn-secondary" href="#/">${icon("back")}Zur Übersicht</a>
      </section>`;
  }

  function render() {
    const id = location.hash.replace(/^#\/?/, "");
    const area = AREAS.find((a) => a.id === id && !a.href);
    if (area) renderArea(area);
    else renderOverview();

    document.querySelectorAll("[data-area]").forEach((link) => {
      if (link.dataset.area === (area ? area.id : "")) link.setAttribute("aria-current", "page");
      else link.removeAttribute("aria-current");
    });
    closePanels();
    window.scrollTo(0, 0);
  }

  window.addEventListener("hashchange", () => {
    if (!hubView.hidden) render();
  });

  // ---------- Konto- und Menü-Panel ----------

  const panels = [
    [document.getElementById("account-toggle"), document.getElementById("account-panel")],
    [document.getElementById("menu-toggle"), document.getElementById("menu-panel")],
  ];

  function closePanels() {
    panels.forEach(([toggle, panel]) => {
      panel.hidden = true;
      toggle.setAttribute("aria-expanded", "false");
    });
  }

  panels.forEach(([toggle, panel]) => {
    toggle.addEventListener("click", (event) => {
      event.stopPropagation();
      const open = panel.hidden;
      closePanels();
      panel.hidden = !open;
      toggle.setAttribute("aria-expanded", String(open));
    });
    panel.addEventListener("click", (event) => {
      if (event.target.closest("a")) closePanels();
      else event.stopPropagation();
    });
  });
  document.addEventListener("click", closePanels);
  document.addEventListener("keydown", (event) => {
    if (event.key === "Escape") closePanels();
  });

  init();
</script>
</body>
</html>
